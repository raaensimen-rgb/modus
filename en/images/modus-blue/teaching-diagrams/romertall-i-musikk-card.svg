<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 442" role="img" aria-labelledby="title desc" lang="en"><title id="title">Keep the degrees when transposing</title><desc id="desc">Keep the degrees when transposing I–vi–IV–V: C major: C → Am → F → G; G major: G → Em → C → D; D major: D → Bm → G → A G is V in C, but I in G: G3 → B3 → D4</desc><rect width="600" height="442" rx="20" fill="#17283c"/><text x="24" y="29" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / PLAY AND UNDERSTAND</text><text x="24" y="59" fill="#e6edf7" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Keep the degrees when transposing</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="288" rx="16" fill="#17283c" stroke="#345677"/><text x="20" y="30" fill="#e6edf7" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">I–vi–IV–V</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="105" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">C major: C → Am → F → G</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="169" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">G major: G → Em → C → D</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="233" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03</text><text x="70" y="233" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">D major: D → Bm → G → A</text></g><path d="M480 427 l16 -12 16 12 16 -12 16 12" stroke="#bfd3eb" fill="none" stroke-width="1.5" opacity=".65"/></svg>