<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 806" role="img" aria-labelledby="title desc" lang="en"><title id="title">The same material, three stylistic choices</title><desc id="desc">The same material, three stylistic choices E–F–D–C above C–F–G–C: E4 → F4 → D4 → C4 Change how the model is treated: Classical: four voices and tendencies; Jazz: sevenths and rhythmic space; Metal: roots/fifths and accents; Compare at the same tempo first</desc><rect width="600" height="806" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / PLAY AND UNDERSTAND</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">The same material, three stylistic choices</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="284" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">E–F–D–C above C–F–G–C</text><path d="M65 154 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 140 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 126 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 112 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 98 H526" stroke="#b5cbc2" stroke-width="1.3"/><text x="20" y="141" fill="#edf3df" font-family="Arial, sans-serif" font-size="54" font-weight="400" text-anchor="start">𝄞</text><ellipse data-note="E4" data-diatonic="0" cx="96.0" cy="154" rx="10" ry="7" transform="rotate(-16 96.0 154)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M105.0 154 V111" stroke="#d9ef8b" stroke-width="2"/><ellipse data-note="F4" data-diatonic="1" cx="229.33333333333334" cy="147" rx="10" ry="7" transform="rotate(-16 229.33333333333334 147)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M238.33333333333334 147 V104" stroke="#d9ef8b" stroke-width="2"/><ellipse data-note="D4" data-diatonic="-1" cx="362.6666666666667" cy="161" rx="10" ry="7" transform="rotate(-16 362.6666666666667 161)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M371.6666666666667 161 V118" stroke="#d9ef8b" stroke-width="2"/><path d="M480.0 168 h32" stroke="#edf3df"/><ellipse data-note="C4" data-diatonic="-2" cx="496.0" cy="168" rx="10" ry="7" transform="rotate(-16 496.0 168)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M505.0 168 V125" stroke="#d9ef8b" stroke-width="2"/><text x="26" y="215" fill="#edf3df" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">E4 → F4 → D4 → C4</text><text x="26" y="244" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sounding notes · no key signature</text></g><g transform="translate(24 400)"><rect x="0" y="0" width="552" height="352" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Change how the model is treated</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Classical: four voices and tendencies</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Jazz: sevenths and rhythmic space</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="233" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-wei