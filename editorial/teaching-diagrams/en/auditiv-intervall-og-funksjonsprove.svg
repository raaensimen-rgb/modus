<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 746" role="img" aria-labelledby="title desc" lang="en"><title id="title">Separate hearing from later calculation</title><desc id="desc">Separate hearing from later calculation Define a blind listening round: 8 interval clips + 4 function clips; Hide notation, names and hand positions; First response → confidence → checking Function in two keys: C → F → G → C; G → C → D → G; The same I–IV–V–I, new pitches</desc><rect width="600" height="746" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / PLAY AND UNDERSTAND</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Separate hearing from later calculation</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="288" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Define a blind listening round</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">8 interval clips + 4 function clips</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Hide notation, names and hand positions</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="233" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03</text><text x="70" y="233" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">First response → confidence → checking</text></g><g transform="translate(24 404)"><rect x="0" y="0" width="552" height="288" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Function in two keys</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">C → F → G → C</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">G → C → D → G</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="233" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03</text><text x="70" y="233" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">The same I–IV–V–I, new pitches</text></g><path d="M480 731 l16 -12 16 12 16 -12 16 12" stroke="#80d6c5" fill="none" stroke-width="1.5" opacity=".65"/></svg>