<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 424" role="img" aria-labelledby="title desc" lang="en"><title id="title">Reach the target. Give the phrase a rest.</title><desc id="desc">Reach the target. Give the phrase a rest. Dm7 · F–A–C–A in quarter notes: F4 → A4 → C5 → A4 G7 · B–D, then four eighth notes: B3 → D4 → D♭4 → C4 → B3 → A3 Cmaj7 in bars 3–4: Land on G. Let the rest answer.; Swing ratio varies with style/tempo</desc><rect width="600" height="424" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / PLAY AND UNDERSTAND</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Reach the target. Give the phrase a rest.</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="270" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Dm7 · F–A–C–A in quarter notes</text><path d="M65 154 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 140 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 126 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 112 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 98 H526" stroke="#b5cbc2" stroke-width="1.3"/><text x="20" y="141" fill="#edf3df" font-family="Arial, sans-serif" font-size="54" font-weight="400" text-anchor="start">𝄞</text><ellipse data-note="F4" data-diatonic="1" cx="96.0" cy="147" rx="10" ry="7" transform="rotate(-16 96.0 147)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M105.0 147 V104" stroke="#d9ef8b" stroke-width="2"/><ellipse data-note="A4" data-diatonic="3" cx="229.33333333333334" cy="133" rx="10" ry="7" transform="rotate(-16 229.33333333333334 133)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M238.33333333333334 133 V90" stroke="#d9ef8b" stroke-width="2"/><ellipse data-note="C5" data-diatonic="5" cx="362.6666666666667" cy="119" rx="10" ry="7" transform="rotate(-16 362.6666666666667 119)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M353.6666666666667 119 V162" stroke="#d9ef8b" stroke-width="2"/><ellipse data-note="A4" data-diatonic="3" cx="496.0" cy="133" rx="10" ry="7" transform="rotate(-16 496.0 133)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M505.0 133 V90" stroke="#d9ef8b" stroke-width="2"/><text x="26" y="201" fill="#edf3df" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">F4 → A4 → C5 → A4</text><text x="26" y="230" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sounding notes · no key signature</text></g><path d="M480 409 l16 -12 16 12 16 -12 16 12" stroke="#80d6c5" fill="none" stroke-width="1.5" opacity=".65"/></svg>