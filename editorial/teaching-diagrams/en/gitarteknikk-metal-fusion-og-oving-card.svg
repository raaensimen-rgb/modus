ont-weight="400" text-anchor="start">6</text><circle data-string="2" data-fret="5" data-note="E4" cx="146.0" cy="135" r="12" fill="#d9ef8b"/><circle data-string="2" data-fret="8" data-note="G4" cx="298.0" cy="135" r="12" fill="#d9ef8b"/><circle data-string="2" data-fret="10" data-note="A4" cx="399.3333333333333" cy="135" r="12" fill="#d9ef8b"/><circle data-string="2" data-fret="12" data-note="B4" cx="500.66666666666663" cy="135" r="12" fill="#d9ef8b"/><text x="26" y="281" fill="#edf3df" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">E4 → G4 → A4 → B4</text><text x="26" y="309" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">String 1 at top · fret numbers above</text><text x="26" y="336" fill="#80d6c5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">E2–A2–D3–G3–B3–E4</text></g><path d="M480 515 l16 -12 16 12 16 -12 16 12" stroke="#80d6c5" fill="none" stroke-width="1.5" opacity=".65"/></svg>