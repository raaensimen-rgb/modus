<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 530" role="img" aria-labelledby="title desc" lang="en"><title id="title">Keep the phrase when changing technique</title><desc id="desc">Keep the phrase when changing technique E–G–A–B on the second string: string 2, fret 5: E4; string 2, fret 8: G4; string 2, fret 10: A4; string 2, fret 12: B4 Bend A towards B · compare the reference: A4 at fret 10 → B4 at fret 12; Target: +2 semitones; Check clean before adding distortion</desc><rect width="600" height="530" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / PLAY AND UNDERSTAND</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Keep the phrase when changing technique</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="376" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">E–G–A–B on the second string</text><path d="M70.0 99 v150" stroke="#738f82"/><text x="95.33333333333333" y="86" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">4</text><path d="M120.66666666666666 99 v150" stroke="#738f82"/><text x="146.0" y="86" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">5</text><path d="M171.33333333333331 99 v150" stroke="#738f82"/><text x="196.66666666666666" y="86" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">6</text><path d="M222.0 99 v150" stroke="#738f82"/><text x="247.33333333333334" y="86" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">7</text><path d="M272.66666666666663 99 v150" stroke="#738f82"/><text x="297.99999999999994" y="86" fill="#b