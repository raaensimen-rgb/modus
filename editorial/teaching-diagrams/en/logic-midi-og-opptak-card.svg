<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 442" role="img" aria-labelledby="title desc" lang="en"><title id="title">MIDI events and audio are different tracks</title><desc id="desc">MIDI events and audio are different tracks Eight-bar production sketch: Piano harmony: MIDI → instrument sound; Guitar melody: audio → recorded sound; Em → C → Am → B7 → Em Versions should be traceable: Keep raw take → edit a copy; Save the project with its audio files; Reopen → check the final bar</desc><rect width="600" height="442" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / PLAY AND UNDERSTAND</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">MIDI events and audio are different tracks</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="288" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Eight-bar production sketch</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Piano harmony: MIDI → instrument sound</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Guitar melody: audio → recorded sound</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="233" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03</text><text x="70" y="233" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Em → C → Am → B7 → Em</text></g><path d="M480 427 l16 -12 16 12 16 -12 16 12" stroke="#80d6c5" fill="none" stroke-width="1.5" opacity=".65"/></svg>