<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 438" role="img" aria-labelledby="title desc" lang="en"><title id="title">Delay the motif. Check the overlap.</title><desc id="desc">Delay the motif. Check the overlap. Motif · four quarter notes: C4 → D4 → E4 → G4 Reply one bar later · a fifth higher: G4 → A4 → B4 → D5 Bass model for realisation: Bass: C → A → D → G → C; C → Am → Dm → G7 → C</desc><rect width="600" height="438" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / PLAY AND UNDERSTAND</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Delay the motif. Check the overlap.</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="284" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Motif · four quarter notes</text><path d="M65 154 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 140 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 126 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 112 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 98 H526" stroke="#b5cbc2" stroke-width="1.3"/><text x="20" y="141" fill="#edf3df" font-family="Arial, sans-serif" font-size="54" font-weight="400" text-anchor="start">𝄞</text><path d="M80.0 168 h32" stroke="#edf3df"/><ellipse data-note="C4" data-diatonic="-2" cx="96.0" cy="168" rx="10" ry="7" transform="rotate(-16 96.0 168)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M105.0 168 V125" stroke="#d9ef8b" stroke-width="2"/><ellipse data-note="D4" data-diatonic="-1" cx="229.33333333333334" cy="161" rx="10" ry="7" transform="rotate(-16 229.33333333333334 161)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M238.33333333333334 161 V118" stroke="#d9ef8b" stroke-width="2"/