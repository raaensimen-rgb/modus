<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 506" role="img" aria-labelledby="title desc" lang="en"><title id="title">Similar opening. Stronger second ending.</title><desc id="desc">Similar opening. Stronger second ending. Eight bars · one chord per bar: 1–4: C | F | Dm | G; Antecedent: end on D above G; 5–8: C | F | G7 | C; Consequent: end on C above C Faster harmonic rhythm at the end: Bar 7: Dm → G7; Bar 8: C → C</desc><rect width="600" height="506" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / PLAY AND UNDERSTAND</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Similar opening. Stronger second ending.</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="352" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Eight bars · one chord per bar</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">1–4: C | F | Dm | G</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Antecedent: end on D above G</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="233" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03</text><text x="70" y="233" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">5–8: C | F | G7 | C</text><rect x="16" y="266" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="297" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">04</text><text x="70" y="297" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Consequent: end on C above C</text></g><path d="M480 491 l16 -12 16 12 16 -12 16 12" stroke="#80d6c5" fill="none" stroke-width="1.5" opacity=".65"/></svg>