<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 917" role="img" aria-labelledby="title desc" lang="en"><title id="title">A shared time span connects the layers</title><desc id="desc">A shared time span connects the layers 3 against 2 · six subdivisions: three at 1, 3, 5; two at 1, 4; six equal subdivisions Three and two in the same cycle: Three: positions 1, 3, 5; Two: positions 1, 4 Old triplet eighth = new eighth: 90 × 3 = 270 attacks/min; 270 ÷ 2 = 135 new quarters/min</desc><rect width="600" height="917" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / PLAY AND UNDERSTAND</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">A shared time span connects the layers</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="283" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">3 against 2 · six subdivisions</text><text x="20" y="103" fill="#80d6c5" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">3</text><circle cx="88" cy="94" r="15" fill="#d9ef8b"/><text x="88" y="125" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">1</text><circle cx="168" cy="94" r="5" fill="#b5cbc2"/><text x="168" y="125" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">2</text><circle cx="248" cy="94" r="15" fill="#d9ef8b"/><text x="248" y="125" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">3</text><circle cx="328" cy="94" r="5" fill="#b5cbc2"/><text x="328" y="125" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">4</text><circle cx="408" cy="94" r="15" fill="#d9ef8b"/><text x="408" y="125" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">5</text><circle cx="488" cy="94" r="5" fill="#b5cbc2"/><text x="488" y="125" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">6</text><text x="20" y="171" fill="#80d6c5" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">2</text><circle cx="88" cy="162" r="15" fill="#d9ef8b"/><text x="88" y="193" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">1</text><circle cx="168" cy="162" r="5" fill="#b5cbc2"/><text x="168" y="193" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">2</text><circle cx="248" cy="162" r="5" fill="#b5cbc2"/><text x="248" y="193" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">3</text><circle cx="328" cy="162" r="15" fill="#d9ef8b"/><text x="328" y="193" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">4</text><circle cx="408" cy="162" r="5" fill="#b5cbc2"/><text x="408" y="193" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">5</text><circle cx="488" cy="162" r="5" fill="#b5cbc2"/><text x="488" y="193" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">6</text><text x="26" y="243" fill="#80d6c5" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Six equally spaced subdivisions</text></g><g transform="translate(24 399)"><rect x="0" y="0" width="552" height="224" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Three and two in the same cycle</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Three: positions 1, 3, 5</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Two: positions 1, 4</text></g><g transform="translate(24 639)"><rect x="0" y="0" width="552" height="224" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Old triplet eighth = new eighth</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">90 × 3 = 270 attacks/min</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">270 ÷ 2 = 135 new quarters/min</text></g><path d="M480 902 l16 -12 16 12 16 -12 16 12" stroke="#80d6c5" fill="none" stroke-width="1.5" opacity=".65"/></svg>