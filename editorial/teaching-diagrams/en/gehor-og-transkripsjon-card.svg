<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 424" role="img" aria-labelledby="title desc" lang="en"><title id="title">Keep the first attempt before checking</title><desc id="desc">Keep the first attempt before checking Original checking phrase · bar 1: E4 → G4 → F♯4 → E4 Bar 2 · two half notes: D4 → E4 Document four distinct stages: Listen and sing → record first response; Check against audio and instrument; Keep the corrected version separate</desc><rect width="600" height="424" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / PLAY AND UNDERSTAND</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Keep the first attempt before checking</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="270" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Original checking phrase · bar 1</text><path d="M65 154 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 140 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 126 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 112 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 98 H526" stroke="#b5cbc2" stroke-width="1.3"/><text x="20" y="141" fill="#edf3df" font-family="Arial, sans-serif" font-size="54" font-weight="400" text-anchor="start">𝄞</text><ellipse data-note="E4" data-diatonic="0" cx="96.0" cy="154" rx="10" ry="7" transform="rotate(-16 96.0 154)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M105.0 154 V111" stroke="#d9ef8b" stroke-width="2"/><ellipse data-note="G4" data-diatonic="2" cx="229.33333333333334" cy="140" rx="10" ry="7" transform="rotate(-16 229.33333333333334 140)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M238.33333333333334 140 V97" stroke="#d9