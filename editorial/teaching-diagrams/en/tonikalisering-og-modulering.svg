<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 792" role="img" aria-labelledby="title desc" lang="en"><title id="title">A common chord gets two readings</title><desc id="desc">A common chord gets two readings C → Am → D7 → G: I → vi in C major; Am = ii in G major; D7 → G = V7 → I in G; New phrase: G → Em → Am → D7 → G F♯ shows a new direction towards G: F♯4 → G4</desc><rect width="600" height="792" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / PLAY AND UNDERSTAND</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">A common chord gets two readings</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="352" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">C → Am → D7 → G</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">I → vi in C major</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Am = ii in G major</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="233" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03</text><text x="70" y="233" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">D7 → G = V7 → I in G</text><rect x="16" y="266" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="297" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">04</text><text x="70" y="297" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">New phrase: G → Em → Am → D7 → G</text></g><g transform="translate(24 468)"><rect x="0" y="0" width="552" height="270" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">F♯ shows a new direction towards G</text><path d="M65 154 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 140 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 126 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 112 H526" stroke="#b5cbc2" stroke-width="1.3"/><path d="M65 98 H526" stroke="#b5cbc2" stroke-width="1.3"/><text x="20" y="141" fill="#edf3df" font-family="Arial, sans-serif" font-size="54" font-weight="400" text-anchor="start">𝄞</text><ellipse data-note="F#4" data-diatonic="1" cx="96.0" cy="147" rx="10" ry="7" transform="rotate(-16 96.0 147)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><text x="70.0" y="153" fill="#edf3df" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle">♯</text><path d="M105.0 147 V104" stroke="#d9ef8b" stroke-width="2"/><ellipse data-note="G4" data-diatonic="2" cx="496.0" cy="140" rx="10" ry="7" transform="rotate(-16 496.0 140)" fill="#d9ef8b" stroke="#d9ef8b" stroke-width="2"/><path d="M505.0 140 V97" stroke="#d9ef8b" stroke-width="2"/><text x="26" y="201" fill="#edf3df" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">F♯4 → G4</text><text x="26" y="230" fill="#b5cbc2" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Sounding notes · no key signature</text></g><path d="M480 777 l16 -12 16 12 16 -12 16 12" stroke="#80d6c5" fill="none" stroke-width="1.5" opacity=".65"/></svg>