<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img"><title>Kvintsirkelen</title><desc>Dur ytterst, relativ moll innenfor. Stigende kvinter med klokken, fallende kvinter mot klokken.</desc><rect width="500" height="500" fill="#182216"/><circle cx="250" cy="250" r="190" fill="#1d2b17" stroke="#607b47"/><circle cx="250" cy="250" r="145" fill="none" stroke="#536a40"/><circle cx="250" cy="250" r="95" fill="#182216" stroke="#425831"/><g><title>C-dur, Am, 0 faste fortegn</title><circle cx="250.0" cy="81.0" r="25" fill="#d7f48c"/><text x="250.0" y="89.0" text-anchor="middle" fill="#182216" font-family="Arial,sans-serif" font-size="25" font-weight="600">C</text><text x="250.0" y="136.0" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="17" font-weight="500">Am</text><text x="250.0" y="38.0" text-anchor="middle" fill="#b7cba3" font-family="Arial,sans-serif" font-size="14" font-weight="500">0</text></g><g><title>G-dur, Em, 1 ♯ faste fortegn</title><circle cx="334.5" cy="103.64" r="25" fill="#293b20"/><text x="334.5" y="111.64" text-anchor="middle" fill="#e3efd7" font-family="Arial,sans-serif" font-size="25" font-weight="600">G</text><text x="310.0" y="152.08" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="17" font-weight="500">Em</text><text x="358.5" y="67.07" text-anchor="middle" fill="#b7cba3" font-family="Arial,sans-serif" font-size="14" font-weight="500">1 ♯</text></g><g><title>D-dur, Bm, 2 ♯ faste fortegn</title><circle cx="396.36" cy="165.5" r="25" fill="#293b20"/><text x="396.36" y="173.5" text-anchor="middle" fill="#e3efd7" font-family="Arial,sans-serif" font-size="25" font-weight="600">D</text><text x="353.92" y="196.0" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="17" font-weight="500">Bm</text><text x="437.93" y="146.5" text-anchor="middle" fill="#b7cba3" font-family="Arial,sans-serif" font-size="14" font-weight="500">2 ♯</text></g><g><title>A-dur, F♯m, 3 ♯ faste fortegn</title><circle cx="419.0" cy="250.0" r="25" fill="#293b20"/><text x="419.0" y="258.0" text-anchor="middle" fill="#e3efd7" font-family="Arial,sans-serif" font-size="25" font-weight="600">A</text><text x="370.0" y="256.0" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="17" font-weight="500">F♯m</text><text x="467.0" y="255.0" text-anchor="middle" fill="#b7cba3" font-family="Arial,sans-serif" font-size="14" font-weight="500">3 ♯</text></g><g><title>E-dur, C♯m, 4 ♯ faste fortegn</title><circle cx="396.36" cy="334.5" r="25" fill="#293b20"/><text x="396.36" y="342.5" text-anchor="middle" fill="#e3efd7" font-family="Arial,sans-serif" font-size="25" font-weight="600">E</text><text x="353.92" y="316.0" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="17" font-weight="500">C♯m</text><text x="437.93" y="363.5" text-anchor="middle" fill="#b7cba3" font-family="Arial,sans-serif" font-size="14" font-weight="500">4 ♯</text></g><g><title>B-dur, G♯m, 5 ♯ faste fortegn</title><circle cx="334.5" cy="396.36" r="25" fill="#293b20"/><text x="334.5" y="404.36" text-anchor="middle" fill="#e3efd7" font-family="Arial,sans-serif" font-size="25" font-weight="600">B</text><text x="310.0" y="359.92" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="17" font-weight="500">G♯m</text><text x="358.5" y="442.93" text-anchor="middle" fill="#b7cba3" font-family="Arial,sans-serif" font-size="14" font-weight="500">5 ♯</text></g><g><title>F♯ / G♭-dur, D♯m / E♭m, 6 ♯ / 6 ♭ faste fortegn</title><circle cx="250.0" cy="419.0" r="25" fill="#293b20"/><text x="250.0" y="427.0" text-anchor="middle" fill="#e3efd7" font-family="Arial,sans-serif" font-size="18" font-weight="600">F♯ / G♭</text><text x="250.0" y="376.0" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="12" font-weight="500">D♯m / E♭m</text><text x="250.0" y="472.0" text-anchor="middle" fill="#b7cba3" font-family="Arial,sans-serif" font-size="14" font-weight="500">6 ♯ / 6 ♭</text></g><g><title>D♭-dur, B♭m, 5 ♭ faste fortegn</title><circle cx="165.5" cy="396.36" r="25" fill="#293b20"/><text x="165.5" y="404.36" text-anchor="middle" fill="#e3efd7" font-family="Arial,sans-serif" font-size="25" font-weight="600">D♭</text><text x="190.0" y="359.92" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="17" font-weight="500">B♭m</text><text x="141.5" y="442.93" text-anchor="middle" fill="#b7cba3" font-family="Arial,sans-serif" font-size="14" font-weight="500">5 ♭</text></g><g><title>A♭-dur, Fm, 4 ♭ faste fortegn</title><circle cx="103.64" cy="334.5" r="25" fill="#293b20"/><text x="103.64" y="342.5" text-anchor="middle" fill="#e3efd7" font-family="Arial,sans-serif" font-size="25" font-weight="600">A♭</text><text x="146.08" y="316.0" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="17" font-weight="500">Fm</text><text x="62.07" y="363.5" text-anchor="middle" fill="#b7cba3" font-family="Arial,sans-serif" font-size="14" font-weight="500">4 ♭</text></g><g><title>E♭-dur, Cm, 3 ♭ faste fortegn</title><circle cx="81.0" cy="250.0" r="25" fill="#293b20"/><text x="81.0" y="258.0" text-anchor="middle" fill="#e3efd7" font-family="Arial,sans-serif" font-size="25" font-weight="600">E♭</text><text x="130.0" y="256.0" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="17" font-weight="500">Cm</text><text x="33.0" y="255.0" text-anchor="middle" fill="#b7cba3" font-family="Arial,sans-serif" font-size="14" font-weight="500">3 ♭</text></g><g><title>B♭-dur, Gm, 2 ♭ faste fortegn</title><circle cx="103.64" cy="165.5" r="25" fill="#293b20"/><text x="103.64" y="173.5" text-anchor="middle" fill="#e3efd7" font-family="Arial,sans-serif" font-size="25" font-weight="600">B♭</text><text x="146.08" y="196.0" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="17" font-weight="500">Gm</text><text x="62.07" y="146.5" text-anchor="middle" fill="#b7cba3" font-family="Arial,sans-serif" font-size="14" font-weight="500">2 ♭</text></g><g><title>F-dur, Dm, 1 ♭ faste fortegn</title><circle cx="165.5" cy="103.64" r="25" fill="#293b20"/><text x="165.5" y="111.64" text-anchor="middle" fill="#e3efd7" font-family="Arial,sans-serif" font-size="25" font-weight="600">F</text><text x="190.0" y="152.08" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="17" font-weight="500">Dm</text><text x="141.5" y="67.07" text-anchor="middle" fill="#b7cba3" font-family="Arial,sans-serif" font-size="14" font-weight="500">1 ♭</text></g><text x="250" y="238" text-anchor="middle" fill="#d7f48c" font-family="Arial,sans-serif" font-size="13" font-weight="600">KVINTSIRKELEN</text><text x="250" y="260" text-anchor="middle" fill="#c4d7af" font-family="Arial,sans-serif" font-size="9" font-weight="500">DUR · YTRE RING</text><text x="250" y="278" text-anchor="middle" fill="#d5b979" font-family="Arial,sans-serif" font-size="9" font-weight="500">MOLL · INDRE RING</text><text x="250" y="485" text-anchor="middle" fill="#a5bd8e" font-family="Arial,sans-serif" font-size="11" font-weight="500">Med klokken: kvinter opp · Mot klokken: kvinter ned</text></svg>