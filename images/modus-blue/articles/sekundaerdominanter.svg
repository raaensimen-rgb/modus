<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 442" role="img" aria-labelledby="title desc" lang="nb"><title id="title">Finn dominanten til det lokale målet</title><desc id="desc">Finn dominanten til det lokale målet Tre mål i C-dur: A7 → Dm · V7/ii → ii; D7 → G · V7/V → V; E7 → Am · V7/vi → vi A7 · C♯ leder til D: A3 → C♯4 → E4 → G4 C♯ → D på andre streng: streng 2, bånd 2: C♯4; streng 2, bånd 3: D4</desc><rect width="600" height="442" rx="20" fill="#17283c"/><text x="24" y="29" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / SPILL OG FORSTÅ</text><text x="24" y="59" fill="#e6edf7" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Finn dominanten til det lokale målet</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="288" rx="16" fill="#17283c" stroke="#345677"/><text x="20" y="30" fill="#e6edf7" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Tre mål i C-dur</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="105" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">A7 → Dm · V7/ii → ii</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="169" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">D7 → G · V7/V → V</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="233" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03</text><text x="70" y="233" fill="#e6edf7" font-family="Arial, sans-serif"