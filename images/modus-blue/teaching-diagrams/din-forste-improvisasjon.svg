<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 728" role="img" aria-labelledby="title desc" lang="nb"><title id="title">En frase trenger også rom</title><desc id="desc">En frase trenger også rom E–G–B · tre akkordtoner: E4 → G4 → B4 Spørsmål og svar: Spill: E–G–B; Vent og lytt; Svar: B–G–E</desc><rect width="600" height="728" rx="20" fill="#17283c"/><text x="24" y="29" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / SPILL OG FORSTÅ</text><text x="24" y="59" fill="#e6edf7" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">En frase trenger også rom</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="270" rx="16" fill="#17283c" stroke="#345677"/><text x="20" y="30" fill="#e6edf7" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">E–G–B · tre akkordtoner</text><path d="M65 154 H526" stroke="#bfd3eb" stroke-width="1.3"/><path d="M65 140 H526" stroke="#bfd3eb" stroke-width="1.3"/><path d="M65 126 H526" stroke="#bfd3eb" stroke-width="1.3"/><path d="M65 112 H526" stroke="#bfd3eb" stroke-width="1.3"/><path d="M65 98 H526" stroke="#bfd3eb" stroke-width="1.3"/><text x="20" y="141" fill="#e6edf7" font-family="Arial, sans-serif" font-size="54" font-weight="400" text-anchor="start">𝄞</text><ellipse data-note="E4" data-diatonic="0" cx="96.0" cy="154" rx="10" ry="7" transform="rotate(-16 96.0 154)" fill="#e6edf7" stroke="#e6edf7" stroke-width="2"/><path d="M105.0 154 V111" stroke="#e6edf7" stroke-width="2"/><ellipse data-note="G4" data-diatonic="2" cx="296.0" cy="140" rx="10" ry="7" transform="rotate(-16 296.0 140)" fill="#e6edf7" stroke="#e6edf7" stroke-width="2"/><path d="M305.0 140 V97" stroke="#e6edf7" stroke-width="2"/><ellipse data-note="B4" data-diatonic="4" cx="496.0" cy="126" rx="10" ry="7" transform="rotate(-16 496.0 126)" fill="#e6edf7" stroke="#e6edf7" stroke-width="2"/><path d="M487.0 126 V169" stroke="#e6ed