<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 378" role="img" aria-labelledby="title desc" lang="nb"><title id="title">Ett toneutvalg. Nye terser.</title><desc id="desc">Ett toneutvalg. Nye terser. Em → C → G → D: Ters: G → E → B → F♯; Røtter: E → C → G → D Alle måltonene finnes i kartet: E3 → F♯3 → G3 → A3 → B3 → C4 → D4</desc><rect width="600" height="378" rx="20" fill="#17283c"/><text x="24" y="29" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / SPILL OG FORSTÅ</text><text x="24" y="59" fill="#e6edf7" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Ett toneutvalg. Nye terser.</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="224" rx="16" fill="#17283c" stroke="#345677"/><text x="20" y="30" fill="#e6edf7" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Em → C → G → D</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="105" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Ters: G → E → B → F♯</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="169" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Røtter: E → C → G → D</text></g><path d="M480 363 l16 -12 16 12 16 -12 16 12" stroke="#bfd3eb" fill="none" stroke-width="1.5" opacity=".65"/></svg>