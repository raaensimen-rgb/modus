<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 437" role="img" aria-labelledby="title desc" lang="nb"><title id="title">Et felles tidsrom binder lagene sammen</title><desc id="desc">Et felles tidsrom binder lagene sammen 3 mot 2 · seks underenheter: trelag på 1, 3, 5; tolag på 1, 4; seks like underenheter Tre- og tolaget i samme omløp: Trelag: posisjon 1, 3, 5; Tolag: posisjon 1, 4 Gammel triolåttendel = ny åttendel: 90 × 3 = 270 anslag/min; 270 ÷ 2 = 135 nye firedeler/min</desc><rect width="600" height="437" rx="20" fill="#17283c"/><text x="24" y="29" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / SPILL OG FORSTÅ</text><text x="24" y="59" fill="#e6edf7" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Et felles tidsrom binder lagene sammen</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="283" rx="16" fill="#17283c" stroke="#345677"/><text x="20" y="30" fill="#e6edf7" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">3 mot 2 · seks underenheter</text><text x="20" y="103" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">3</text><circle cx="88" cy="94" r="15" fill="#e6edf7"/><text x="88" y="125" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">1</text><circle cx="168" cy="94" r="5" fill="#bfd3eb"/><text x="168" y="125" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">2</text><circle cx="248" cy="94" r="15" fill="#e6edf7"/><text x="248" y="125" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">3</text><circle cx="328" cy="94" r="5" fill="#bfd3eb"/><text x="328" y="125" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">4</text><circle cx="408" cy="94"