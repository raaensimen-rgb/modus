<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 746" role="img" aria-labelledby="title desc" lang="nb"><title id="title">MIDI-hendelser og audio er ulike spor</title><desc id="desc">MIDI-hendelser og audio er ulike spor Åttetakters produksjonsskisse: Piano-harmoni: MIDI → instrumentlyd; Gitar-melodi: audio → innspilt lyd; Em → C → Am → B7 → Em Versjoner skal være etterprøvbare: Behold råtake → rediger kopi; Lagre prosjekt med lydfiler; Åpne igjen → kontroller siste takt</desc><rect width="600" height="746" rx="20" fill="#17283c"/><text x="24" y="29" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / SPILL OG FORSTÅ</text><text x="24" y="59" fill="#e6edf7" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">MIDI-hendelser og audio er ulike spor</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="288" rx="16" fill="#17283c" stroke="#345677"/><text x="20" y="30" fill="#e6edf7" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Åttetakters produksjonsskisse</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="105" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Piano-harmoni: MIDI → instrumentlyd</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="169" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Gitar-melodi: audio → innspilt lyd</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="233" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03</text><text x="70" y="233" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Em → C → Am → B7 → Em</text></g><g transform="translate(24 404)"><rect x="0" y="0" width="552" height="288" rx="16" fill="#17283c" stroke="#345677"/><text x="20" y="30" fill="#e6edf7" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Versjoner skal være etterprøvbare</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="105" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Behold råtake → rediger kopi</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="169" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Lagre prosjekt med lydfiler</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#17283c"/><text x="30" y="233" fill="#bfd3eb" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03</text><text x="70" y="233" fill="#e6edf7" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Åpne igjen → kontroller siste takt</text></g><path d="M480 731 l16 -12 16 12 16 -12 16 12" stroke="#bfd3eb" fill="none" stroke-width="1.5" opacity=".65"/></svg>