<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 810" role="img" aria-labelledby="title desc" lang="nb"><title id="title">Skill notert og klingende tonehøyde</title><desc id="desc">Skill notert og klingende tonehøyde Transponering av notert C4: B♭-klarinett: C4 → B♭3 (−2); Horn i F: C4 → F3 (−7); Gitar: C4 → C3 (−12) Åtte takter med plass til lagene: 1–2: gitarostinat og bass; 3–4: lange strykertoner; 5–6: piano · gitaren har pause; 7–8: samlet ankomst</desc><rect width="600" height="810" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / SPILL OG FORSTÅ</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Skill notert og klingende tonehøyde</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="288" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Transponering av notert C4</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">B♭-klarinett: C4 → B♭3 (−2)</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Horn i F: C4 → F3 (−7)</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="233" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03</text><text x="70" y="233" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Gitar: C4 → C3 (−12)</text></g><g transform="translate(24 404)"><rect x="0" y="0" width="552" height="352" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Åtte takter med plass til lagene</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">1–2: gitarostinat og bass</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">3–4: lange strykertoner</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="233" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03</text><text x="70" y="233" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">5–6: piano · gitaren har pause</text><rect x="16" y="266" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="297" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">04</text><text x="70" y="297" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">7–8: samlet ankomst</text></g><path d="M480 795 l16 -12 16 12 16 -12 16 12" stroke="#80d6c5" fill="none" stroke-width="1.5" opacity=".65"/></svg>