<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 378" role="img" aria-labelledby="title desc" lang="nb"><title id="title">Et svar kan endre det neste spørsmålet</title><desc id="desc">Et svar kan endre det neste spørsmålet Dm7 → G → Dm7 → Dm7: Runde 1: 4 takter gitar + 4 piano; Runde 2: 2 takter gitar + 2 piano Velg hva du svarer på: Rytme → nye toner; Kontur → ny rytme; Dynamikk → likhet eller kontrast; Bytt roller og noter tidskoder</desc><rect width="600" height="378" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / SPILL OG FORSTÅ</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Et svar kan endre det neste spørsmålet</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="224" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Dm7 → G → Dm7 → Dm7</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Runde 1: 4 takter gitar + 4 piano</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Runde 2: 2 takter gitar + 2 piano</text></g><path d="M480 363 l16 -12 16 12 16 -12 16 12" stroke="#80d6c5" fill="none" stroke-width="1.5" opacity=".65"/></svg>