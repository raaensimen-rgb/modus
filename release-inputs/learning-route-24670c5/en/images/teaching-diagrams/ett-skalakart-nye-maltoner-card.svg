<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 378" role="img" aria-labelledby="title desc" lang="en"><title id="title">One note collection. New thirds.</title><desc id="desc">One note collection. New thirds. Em → C → G → D: Third: G → E → B → F♯; Roots: E → C → G → D All target notes belong to the collection: E3 → F♯3 → G3 → A3 → B3 → C4 → D4</desc><rect width="600" height="378" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / PLAY AND UNDERSTAND</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">One note collection. New thirds.</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="224" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Em → C → G → D</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Third: G → E → B → F♯</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Roots: E → C → G → D</text></g><path d="M480 363 l16 -12 16 12 16 -12 16 12" stroke="#80d6c5" fill="none" stroke-width="1.5" opacity=".65"/></svg>