<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 506" role="img" aria-labelledby="title desc" lang="nb"><title id="title">Nabotonearter og en kadens</title><desc id="desc">Nabotonearter og en kadens Røtter og funksjoner i C-dur: F ← C → G; IV ← I → V; Dm7 → G7 → Cmaj7; Røtter: D → G → C G-dur · én ny tone: F♯: G3 → A3 → B3 → C4 → D4 → E4 → F♯4</desc><rect width="600" height="506" rx="20" fill="#12231f"/><text x="24" y="29" fill="#80d6c5" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">MODUS / SPILL OG FORSTÅ</text><text x="24" y="59" fill="#edf3df" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Nabotonearter og en kadens</text><g transform="translate(24 100)"><rect x="0" y="0" width="552" height="352" rx="16" fill="#1c332d" stroke="#4e7065"/><text x="20" y="30" fill="#d9ef8b" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Røtter og funksjoner i C-dur</text><rect x="16" y="74" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="105" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">01</text><text x="70" y="105" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">F ← C → G</text><rect x="16" y="138" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="169" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">02</text><text x="70" y="169" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">IV ← I → V</text><rect x="16" y="202" width="520" height="52" rx="8" fill="#12231f"/><text x="30" y="233" fill="#80d6c5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">03</text><text x="70" y="233" fill="#edf3df" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Dm7 → G7 → Cmaj7</tex