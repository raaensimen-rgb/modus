<style id="modus-library-landscape">
/* Use the viewport's layout width, excluding a classic vertical scrollbar. */
:root { container-type: inline-size; }
html:not([data-theme="readable"]):not([data-theme="contrast"]) .modus-interior[data-shared-landscape] .site-header {
  background: transparent !important;
}
html:not([data-theme="readable"]):not([data-theme="contrast"]) .modus-interior[data-shared-landscape] .site-header::before {
  inset: 0 !important;
  height: auto !important;
  background: linear-gradient(180deg, #001918eb, #00191896 48%, #00191850 82%, #00191800) !important;
}
html:not([data-theme="readable"]):not([data-theme="contrast"]) .modus-interior[data-shared-landscape] .library-hero {
  --library-landscape-inset: calc((100% - 100cqw) / 2);
  overflow: visible;
  clip-path: inset(calc(-1 * var(--library-header-height)) var(--library-landscape-inset) -70px);
}
.modus-interior .library-hero-wave-frame {
  position: absolute;
  inset: 0;
  overflow: hidden;
  z-index: 1;
  pointer-events: none;
}
html:not([data-theme="readable"]):not([data-theme="contrast"]) .modus-interior[data-shared-landscape] .library-hero .articles-landscape {
  inset: calc(-1 * var(--library-header-height)) var(--library-landscape-inset) -70px !important;
  height: auto;
}
html:not([data-theme="readable"]):not([data-theme="contrast"]) .modus-interior[data-shared-landscape] .library-hero .articles-landscape img {
  object-position: center 10% !important;
}
html:not([data-theme="readable"]):not([data-theme="contrast"]) .modus-interior[data-shared-landscape] .site-nav::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  color: #001918b8;
  background: currentColor;
  box-shadow: 0 0 0 100vmax currentColor;
  clip-path: inset(0 -100vmax);
  pointer-events: none;
}
html:not([data-theme="readable"]):not([data-theme="contrast"]) .modus-interior .site-header::after {
  background-position: center -20px !important;
  background-size: min(72%, 1040px) 118px !important;
  mask-image: linear-gradient(90deg, transparent 20%, #000 39%, #000 61%, transparent 80%);
  opacity: .95;
}
@media (max-width: 760px) {
  html:not([data-theme="readable"]):not([data-theme="contrast"]) .modus-interior .site-header::after {
    background-position: center -13px !important;
    background-size: 120% 82px !important;
    mask-image: linear-gradient(90deg, transparent, #000 23%, #000 77%, transparent);
  }
}
html:not([data-theme="readable"]):not([data-theme="contrast"]) .modus-interior[data-shared-landscape] .library-hero .articles-landscape::after {
  background: linear-gradient(90deg, #001a19fa, #001a19a8 36%, #001a1926 80%),
    linear-gradient(0deg, #001a19, #001a1900 36%);
}
.modus-interior[data-shared-landscape] .articles-page > .library {
  position: relative;
  z-index: 1;
}
@media (forced-colors: active) {
  .modus-interior[data-shared-landscape] .site-header { background: Canvas !important; }
  .modus-interior[data-shared-landscape] .site-header::before,
  .modus-interior[data-shared-landscape] .site-nav::before { display: none; }
}
</style>
<script id="modus-library-resize">
(() => {
  const header = document.querySelector('.site-header');
  if (!header || typeof ResizeObserver !== 'function') return;
  const update = () => {
    document.body.style.setProperty('--library-header-height', header.getBoundingClientRect().height + 'px');
    document.body.setAttribute('data-shared-landscape', '');
  };
  update();
  new ResizeObserver(update).observe(header);
})();
</script>
