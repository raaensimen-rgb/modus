name: MODUS build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Install pinned QA YAML parser
        run: python -m pip install --requirement .github/qa/requirements.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Build the public site
        run: npm run build
      - name: Validate site and music features
        run: npm test

      - name: Show test report in run summary
        if: always()
        run: |
          if [ -f test-results/test-results.md ]; then
            cat test-results/test-results.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No test report was produced. Inspect installation/build steps; QA is not passed.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload individual test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modus-test-results
          path: |
            test-results/test-results.json
            test-results/test-results.md
          if-no-files-found: warn
