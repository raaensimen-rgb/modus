name: MODUS local-equivalent checks (never deploy)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Prepare SHA-bound C07 candidate; main is intentionally refused
        run: npm run production:workflow -- prepare --sha "$(git rev-parse HEAD)" --out "$RUNNER_TEMP/modus-candidate"
      - name: Preserve checks and reports, never an implicit production dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modus-qa-evidence
          path: |
            ${{ runner.temp }}/modus-candidate/report.*
            ${{ runner.temp }}/modus-candidate/quality.log
            ${{ runner.temp }}/modus-candidate/qa.json
          if-no-files-found: warn
# There is no Cloudflare credential, deploy, push or merge step.
# Cloudflare Git autodeploy remains disabled; C06 uses a separately approved package.
