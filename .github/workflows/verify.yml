name: MODUS build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modus-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Build the public site
        id: build
        run: npm run build
      - name: Validate site and music features
        id: tests
        run: npm test

      - name: Publish quality summary
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          if [ -f test-results/test-results.md ]; then
            cat test-results/test-results.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## MODUS quality round\n\nNo test report was produced. Build: %s. Tests: %s. Inspect the failed or skipped steps.\n' "$BUILD_RESULT" "$TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nAutomated checks do not approve music theory, visual appearance or production publication.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload individual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modus-test-results
          path: |
            test-results/test-results.json
            test-results/test-results.md
          if-no-files-found: warn
