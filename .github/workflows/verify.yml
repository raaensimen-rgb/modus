name: MODUS build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Build the public site
        run: npm run build
      - name: Validate site and music features
        run: npm test

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Verify release in desktop and mobile browsers
        run: node tests/release-browser.cjs

      - name: Verify piano interaction in desktop and mobile browsers
        run: node tests/piano-browser.cjs

      - name: Verify actual audio signal and visualization fallback
        run: node tests/audio-signal-browser.cjs

      - name: Upload individual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modus-test-results
          path: |
            test-results/test-results.json
            test-results/test-results.md
            test-results/browser-results.json
            test-results/piano-browser-results.json
            test-results/audio-*-results.json
          if-no-files-found: warn
